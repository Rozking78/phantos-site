<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer">
<title>Never Look Back</title>
<link rel="icon" href="img/mark.svg" type="image/svg+xml">
<style>
  :root{color-scheme:dark}
  html,body{margin:0;background:#0b0d10;color:#e8ebef;font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  main{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
  .wrap{max-width:520px;width:100%;text-align:center}
  img.logo{width:100%;max-width:380px;height:auto;display:block;margin:0 auto 8px}
  p{margin:0 0 20px;color:#9aa3ad}
  a.go{display:block;background:#e8ebef;color:#0b0d10;text-decoration:none;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:16px;min-height:44px;box-sizing:border-box}
  a.go:active{transform:translateY(1px)}
  nav{margin-top:22px;font-size:13px;letter-spacing:.06em;color:#6c7580}
  nav a{color:#9aa3ad;text-decoration:none;margin:0 10px}
</style></head><body>
<main><div class="wrap">
  <img class="logo" src="img/logo.svg" alt="Never Look Back, Springsteen tribute">
  <p>The band's songbook: setlists, repertoire, and lyrics and chords charts.</p>
  <a class="go" href="songbook/">Open the songbook</a>
  <nav><a href="./">Home</a><a href="songbook/">Songbook</a></nav>
</div></main>
</body></html>
