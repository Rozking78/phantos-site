<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer">
<title>Phantos Live</title>
<style>
  :root{color-scheme:dark}
  html,body{margin:0;background:#0d1210;color:#e9ede9;font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  main{min-height:100vh;display:grid;place-items:center;padding:24px}
  .card{max-width:460px;width:100%;background:#151b18;border:1px solid #38433e;padding:28px 26px}
  h1{font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:#f0bc60;margin:0 0 10px;font-family:ui-monospace,Menlo,monospace}
  p{margin:0 0 14px;color:#98a39c}
  a.go{display:block;text-align:center;background:#63c08b;color:#07130c;text-decoration:none;font-weight:700;letter-spacing:.06em;padding:16px;margin-top:18px;font-family:ui-monospace,Menlo,monospace;min-height:44px}
  a.go:active{transform:translateY(1px)}
  .small{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:#6e7973;margin-top:14px;word-break:break-all}
</style></head><body><main><div class="card">
  <h1>Phantos Live</h1>
  <p>Show crew only. The live page runs on the show machine and asks for the crew password.</p>
  <a class="go" id="go" href="#">OPEN THE LIVE PAGE</a>
  <div class="small" id="where">finding the show machine…</div>
</div></main>
<script>
(function(){
  var go=document.getElementById('go'), where=document.getElementById('where');
  fetch('target.json?v='+Date.now(),{cache:'no-store'}).then(function(r){return r.json()}).then(function(t){
    go.href=t.url; where.textContent=t.url;
    if(!/nogo/.test(location.search)) setTimeout(function(){location.replace(t.url)},900);
  }).catch(function(){ where.textContent='The show machine address could not be read. Try again in a minute.'; });
})();
</script></body></html>
